# /etc/ssh/sshd_config.d/00-hardening.conf
# sshd keeps the FIRST value it reads for each keyword and includes this directory in
# lexical order: "00-" wins over cloud-init's 50-cloud-init.conf (which re-enables
# password logins).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
AllowUsers ubuntu
