# /etc/nginx/sites-available/sc-tracker (symlinked in sites-enabled; included inside http {}).

# Credential stuffing guard in front of the app's own per-IP login limit.
limit_req_zone $binary_remote_addr zone=sc_login:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/ssl/certs/sc-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/sc-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audio uploads are capped at 25 MB by the API.
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No HSTS while the certificate is self-signed (browsers ignore it anyway).

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, never append: the web front and the API trust the first entry,
    # so a client-supplied X-Forwarded-For must not survive this hop.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  "";
    proxy_read_timeout 120s;

    location = /api/auth/login {
        limit_req zone=sc_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    # The Next.js image optimizer is unused (images are unoptimized) — close it.
    location /_next/image {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
